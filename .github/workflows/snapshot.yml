name: daily snapshot

# Once a day: read the public leaderboard, store an anonymised snapshot,
# rebuild docs/index.html (served by GitHub Pages) and commit both.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: vec-insights snapshot --dir snapshots
      - run: vec-insights dashboard --dir snapshots --out docs/index.html
      - run: vec-insights overview --dir snapshots >> "$GITHUB_STEP_SUMMARY"
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots docs/index.html
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
