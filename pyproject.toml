[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vec-leaderboard-insights"
version = "0.1.0"
description = "Headroom and rank what-ifs from the public Virtual Embryo Challenge leaderboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
vec-insights = "vec_insights.cli:main"

[project.urls]
Homepage = "https://github.com/WaelYTz/vec-leaderboard-insights"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vec_insights = ["dashboard_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
